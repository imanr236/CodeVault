name: Bug report
description: Report a reproducible problem in CodeVault.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Search existing issues first. Do not include passwords, API keys, tokens, or private snippets."
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Use sample data only. Remove all secrets and private snippets.
    validations:
      required: false
