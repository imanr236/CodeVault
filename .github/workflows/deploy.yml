name: Deploy CodeVault to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run dependency security audit (report only)
        run: |
          npm audit --json > audit-report.json || true
          node -e 'const report = require("./audit-report.json"); const vulnerabilities = report.vulnerabilities || {}; console.log(JSON.stringify({ metadata: report.metadata?.vulnerabilities, error: report.error || null, vulnerabilities: Object.entries(vulnerabilities).map(([name, item]) => ({ name, severity: item.severity, isDirect: item.isDirect, range: item.range, nodes: item.nodes, via: item.via.map((entry) => typeof entry === "string" ? entry : { title: entry.title, url: entry.url, range: entry.range, severity: entry.severity }), fixAvailable: item.fixAvailable })) }, null, 2));'
      - name: Run automated tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Commit npm lockfile
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add npm lockfile"
          git push
      - name: Build app
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
